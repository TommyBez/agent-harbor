name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  broker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: sudo apt-get update && sudo apt-get install -y tmux
      - run: node --test test/backend/*.test.mjs
  desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - run: pnpm test
      - run: pnpm test:ui
      - run: pnpm check
      - run: pnpm build
      - run: pnpm package
