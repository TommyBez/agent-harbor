name: Release
# Every pull request merged into main is tagged vX.Y.Z and published as a GitHub
# release with a DMG. Labels on the merged pull request choose the bump:
# release:minor, release:major or release:skip; the default is a patch release.
# Direct pushes to main are not released. A manual run builds and verifies the
# DMG as a workflow artifact without tagging or publishing anything.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
# Runs are serialized, so each one computes its version from the previous tag.
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release=false
          bump="patch"
          pr=""
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at != null and .base.ref == "main")][0] // empty')
            if [ -n "$merged" ]; then
              pr=$(jq -r .number <<<"$merged")
              labels=",$(jq -r '[.labels[].name] | join(",")' <<<"$merged"),"
              release=true
              case "$labels" in *,release:skip,*) release=false ;; esac
              case "$labels" in *,release:major,*) bump=major ;; *,release:minor,*) bump=minor ;; esac
            fi
          fi
          git fetch --tags --force
          # shellcheck disable=SC2046
          version=$(node scripts/next-version.mjs "$bump" $(git tag -l 'v*'))
          {
            echo "release=$release"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          echo "Pull request: ${pr:-none} · bump: $bump · version: $version · publish: $release" >> "$GITHUB_STEP_SUMMARY"
  dmg:
    needs: plan
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: mlugg/setup-zig@v2
        with:
          version: '0.16.0'
      - run: npm install -g pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: brew list tmux >/dev/null 2>&1 || brew install tmux
      - run: node scripts/stamp-version.mjs "$VERSION"
      - run: pnpm test
      - run: pnpm test:ui
      - run: pnpm check
      # Release builds omit the Native SDK automation server.
      - run: pnpm build:release
      - run: pnpm package
      - run: pnpm dmg
      - name: Verify the disk image
        run: |
          dmg="dist/Agent-Harbor-$VERSION-arm64.dmg"
          (cd dist && shasum -a 256 -c "Agent-Harbor-$VERSION-arm64.dmg.sha256")
          mount=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount"' EXIT
          test -L "$mount/Applications"
          codesign --verify --deep --strict "$mount/Agent Harbor.app"
          test -x "$mount/Agent Harbor.app/Contents/Resources/runtime/node"
          test -f "$mount/Agent Harbor.app/Contents/Resources/harbor/broker/daemon.mjs"
          if strings "$mount/Agent Harbor.app/Contents/MacOS/agent-harbor" | grep -q native-sdk-automation; then
            echo "::error::The release binary contains the automation server"; exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$mount/Agent Harbor.app/Contents/Info.plist" | grep -qx "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: agent-harbor-${{ env.VERSION }}-dmg
          path: |
            dist/Agent-Harbor-*.dmg
            dist/Agent-Harbor-*.dmg.sha256
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: [plan, dmg]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-harbor-*-dmg
          merge-multiple: true
          path: release
      - name: Tag and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in 0.*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          ## Install

          1. Download \`Agent-Harbor-$VERSION-arm64.dmg\` (Apple silicon) and open it.
          2. Drag **Agent Harbor** to **Applications**.
          3. This build is ad-hoc signed, not notarized by Apple. On first launch macOS refuses to open it: open **System Settings › Privacy & Security** and choose **Open Anyway**, or run \`xattr -dr com.apple.quarantine "/Applications/Agent Harbor.app"\`.

          Agent Harbor needs tmux and the original \`claude\` and/or \`codex\` CLIs installed and signed in. The app bundles its own Node.js runtime. Verify the download with the attached \`.sha256\` file: \`shasum -a 256 -c Agent-Harbor-$VERSION-arm64.dmg.sha256\`.
          EOF
          # Creates the vX.Y.Z tag on the merged commit.
          gh release create "v$VERSION" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Agent Harbor $VERSION" --notes-file notes.md --generate-notes $prerelease
